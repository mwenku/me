<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@450;500&family=Space+Mono&display=swap" rel="stylesheet" />
    <title>Lucas Nkuta — Social Preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      .social-card { position: relative; container-type: inline-size; width: 100%; aspect-ratio: 1200 / 630; overflow: hidden; background: #f4f3ee; color: #24241f; font-family: "DM Sans", sans-serif; }
      .card-content { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 5cqw; }
      .card-header { display: flex; align-items: center; justify-content: space-between; }
      .card-logo { width: 5cqw; height: 5cqw; }
      .card-identity { text-align: right; }
      .card-name { margin: 0 0 .5cqw; font-size: 1.8cqw; font-weight: 500; }
      .card-role { margin: 0; color: #71716a; font-family: "Space Mono", monospace; font-size: 1cqw; }
      .card-heading { position: relative; isolation: isolate; margin: auto 0; font-size: 7.2cqw; font-weight: 450; line-height: 1.08; letter-spacing: -.055em; }
      .card-heading::before { content: ""; position: absolute; z-index: -1; inset: -2cqw -5cqw; background: url("../public/textures/hero-grain.svg") center / 180px; opacity: .28; mask-image: radial-gradient(ellipse at 35% 50%, #000 10%, transparent 65%); }
      .card-heading span { color: #4b4b4b; }
      .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 2cqw; padding-top: 2cqw; border-top: 1px solid #d9d8d1; }
      .card-location { margin: 0; font-family: "Space Mono", monospace; font-size: 1.1cqw; }
      .card-location span { margin-left: 1cqw; color: #71716a; }
      .card-availability { display: flex; align-items: center; gap: .8cqw; margin: 0; color: #525252; font-size: 1.25cqw; }
      .card-availability::before { content: ""; width: .6cqw; height: .6cqw; border-radius: 50%; background: #5e7d60; box-shadow: 0 0 0 .3cqw #5e7d6014; }
    </style>
  </head>
  <body>
    <main class="social-card">
      <div class="card-content">
        <header class="card-header">
          <img class="card-logo" src="../public/branding/logo-black.svg" alt="Lucas Nkuta monogram" />
          <div class="card-identity">
            <p class="card-name">Lucas Nkuta</p>
            <p class="card-role">FULL-STACK SOFTWARE ENGINEER</p>
          </div>
        </header>
        <h1 class="card-heading">Building products<br /><span>&amp; scaling systems.</span></h1>
        <footer class="card-footer">
          <p class="card-location">Lusaka, Zambia <span>UTC+2</span></p>
          <p class="card-availability">Open to US East Coast &amp; EU working hours</p>
        </footer>
      </div>
    </main>
  </body>
</html>
